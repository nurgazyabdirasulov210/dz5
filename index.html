<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hand Portal</title>
<style>
  :root { --bg:#0d0f14; --fg:#e8eaf0; --muted:#8b91a1; --accent:#ff3d6e; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:#000; color:var(--fg); overflow:hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #stage { position:fixed; inset:0; background:#000; }
  canvas { width:100%; height:100%; display:block; object-fit:cover; }
  video { display:none; }
  #overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:12px; background:rgba(13,15,20,.92); text-align:center; padding:24px; z-index:5; }
  #overlay h1 { margin:0; font-size:1.3rem; letter-spacing:.08em; }
  #overlay p { margin:0; color:var(--muted); max-width:34em; line-height:1.5; }
  button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:12px 26px;
    font-size:1rem; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.6; cursor:default; }
  .pill { position:absolute; background:rgba(0,0,0,.55); padding:6px 12px; border-radius:20px;
    font-size:.85rem; backdrop-filter:blur(4px); }
  #badge { left:12px; bottom:12px; }
  #status { right:12px; top:12px; font-size:.8rem; color:#c5c9d6; }
  #tools { position:absolute; right:12px; bottom:12px; display:flex; gap:8px; }
  #tools button { background:rgba(0,0,0,.55); padding:8px 14px; font-size:.85rem; backdrop-filter:blur(4px); }
  #flash { position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:4; }
  #flash.go { animation: flash .45s ease-out; }
  @keyframes flash { 0% { opacity:.9 } 100% { opacity:0 } }
  #ring { position:absolute; left:50%; top:50%; width:110px; height:110px; margin:-55px 0 0 -55px;
    pointer-events:none; opacity:0; transition:opacity .15s; z-index:3; }
  #ring.on { opacity:1; }
  #ring circle { fill:rgba(0,0,0,.35); stroke:#fff; stroke-width:6; stroke-linecap:round;
    transform:rotate(-90deg); transform-origin:50% 50%; }
  #ring text { fill:#fff; font-size:34px; text-anchor:middle; dominant-baseline:central; }
  #toast { position:absolute; left:50%; top:16px; transform:translate(-50%,-140%); background:rgba(20,24,34,.92);
    padding:10px 16px; border-radius:12px; font-size:.9rem; z-index:6; display:flex; align-items:center; gap:12px;
    transition:transform .3s; max-width:92vw; }
  #toast.show { transform:translate(-50%,0); }
  #toast img { height:44px; border-radius:6px; }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="out" width="640" height="480"></canvas>
    <video id="cam" playsinline muted></video>
    <div id="badge" class="pill" hidden></div>
    <div id="status" class="pill" hidden></div>
    <svg id="ring" viewBox="0 0 110 110"><circle id="ringArc" cx="55" cy="55" r="48" fill="none"
      stroke-dasharray="301.6" stroke-dashoffset="301.6"/><text x="55" y="57">📸</text></svg>
    <div id="flash"></div>
    <div id="toast"><img id="toastImg" alt=""><span id="toastTxt"></span></div>
    <div id="overlay">
      <h1>HAND PORTAL</h1>
      <p>Сложи большие и указательные пальцы обеих рук «рамкой» — внутри появится портал с фильтром.<br>
         Раскрой обе ладони — смена фильтра.<br>
         Покажи 2 или 3 пальца и подержи секунду — скриншот сохранится.</p>
      <button id="start">Включить камеру</button>
      <p id="msg"></p>
    </div>
  </div>

<script type="module">
import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const $ = id => document.getElementById(id);
const video = $("cam"), canvas = $("out"), ctx = canvas.getContext("2d", { willReadFrequently: true });
const badge = $("badge"), statusEl = $("status"), overlay = $("overlay"), msg = $("msg"), startBtn = $("start");
let W = canvas.width, H = canvas.height;

// ---------- Фильтры ----------
const lum = (d, i) => 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];

// Рисует полутон: круги по сетке, радиус зависит от яркости (или тёмности)
function halftone(g, img, w, h, { cell, bg, dot, invert }) {
  g.fillStyle = bg; g.fillRect(0, 0, w, h);
  g.fillStyle = dot;
  for (let y = 0; y < h; y += cell) for (let x = 0; x < w; x += cell) {
    let s = 0, n = 0;
    for (let yy = y; yy < Math.min(y + cell, h); yy += 2)
      for (let xx = x; xx < Math.min(x + cell, w); xx += 2) { s += lum(img.data, (yy * w + xx) * 4); n++; }
    const v = s / n / 255, k = invert ? v : 1 - v;
    const r = Math.sqrt(k) * cell * 0.62;
    if (r > 0.3) { g.beginPath(); g.arc(x + cell / 2, y + cell / 2, r, 0, 6.2832); g.fill(); }
  }
}

function mapPixels(img, fn) {
  const d = img.data;
  for (let i = 0; i < d.length; i += 4) fn(d, i);
  return img;
}

function heat(t) { // 0..1 -> синий → голубой → зелёный → жёлтый → оранжевый
  const st = [[0,[20,40,255]],[.3,[0,200,255]],[.5,[40,230,90]],[.75,[255,230,0]],[1,[255,110,0]]];
  for (let i = 1; i < st.length; i++) if (t <= st[i][0]) {
    const [a, ca] = st[i - 1], [b, cb] = st[i], u = (t - a) / (b - a);
    return ca.map((c, k) => c + (cb[k] - c) * u);
  }
  return st[st.length - 1][1];
}

// Мультяшный стиль: сглаживание, постеризация, насыщенность и чёрные контуры (оператор Собеля)
function cartoon(img, w, h, { levels, sat, edge, ink }) {
  const d = img.data, n = w * h, L = new Float32Array(n), src = new Uint8ClampedArray(d);
  // box-blur 3x3 дважды — убирает шум кожи и текстур
  for (let pass = 0; pass < 3; pass++) {
    const t = new Uint8ClampedArray(d);
    for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++) for (let c = 0; c < 3; c++) {
      let s = 0;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) s += t[((y + dy) * w + x + dx) * 4 + c];
      d[(y * w + x) * 4 + c] = s / 9;
    }
  }
  for (let i = 0; i < n; i++) L[i] = lum(d, i * 4);
  for (let i = 0; i < n; i++) {
    const j = i * 4, l = L[i] || 1;
    // яркость делится на плоские полосы, оттенок остаётся прежним (кожа — кожей)
    const band = Math.min(255, (Math.floor(l / 255 * levels) + 0.6) / levels * 255 * 1.08);
    const k = band / l;
    for (let c = 0; c < 3; c++) {
      const v = l + (d[j + c] - l) * sat;              // насыщенность
      d[j + c] = Math.max(0, Math.min(255, v * k));
    }
  }
  for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++) {
    const i = y * w + x;
    const gx = -L[i - w - 1] - 2 * L[i - 1] - L[i + w - 1] + L[i - w + 1] + 2 * L[i + 1] + L[i + w + 1];
    const gy = -L[i - w - 1] - 2 * L[i - w] - L[i - w + 1] + L[i + w - 1] + 2 * L[i + w] + L[i + w + 1];
    if (Math.hypot(gx, gy) > edge) { const j = i * 4; d[j] = ink[0]; d[j + 1] = ink[1]; d[j + 2] = ink[2]; }
  }
  return img;
}

const FILTERS = [
  { name: "Сетка", draw(g, img, w, h, q) { g.putImageData(img, 0, 0); } , grid: true },
  { name: "Аниме", draw(g, img, w, h) { g.putImageData(cartoon(img, w, h, { levels: 5, sat: 1.5, edge: 70, ink: [30, 20, 45] }), 0, 0); } },
  { name: "Мультфильм", draw(g, img, w, h) { g.putImageData(cartoon(img, w, h, { levels: 4, sat: 1.8, edge: 55, ink: [0, 0, 0] }), 0, 0); } },
  { name: "Манга", draw(g, img, w, h) {
      const e = cartoon(img, w, h, { levels: 3, sat: 0, edge: 70, ink: [0, 0, 0] }); g.putImageData(e, 0, 0); } },
  { name: "Полутон", draw(g, img, w, h) { halftone(g, img, w, h, { cell: 6, bg: "#ffe3ea", dot: "#d1103f" }); } },
  { name: "Поп-арт", draw(g, img, w, h) {
      g.putImageData(mapPixels(img, (d, i) => {
        const l = lum(d, i), c = l < 80 ? [10, 5, 15] : l < 160 ? [255, 45, 130] : [255, 150, 20];
        d[i] = c[0]; d[i + 1] = c[1]; d[i + 2] = c[2];
      }), 0, 0); } },
  { name: "Точки", draw(g, img, w, h) { halftone(g, img, w, h, { cell: 7, bg: "#000", dot: "#fff", invert: true }); } },
  { name: "Аберрация", draw(g, img, w, h) {
      const src = new Uint8ClampedArray(img.data), d = img.data, off = 6;
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
        const i = (y * w + x) * 4;
        d[i] = src[(y * w + Math.max(0, x - off)) * 4];
        d[i + 2] = src[(y * w + Math.min(w - 1, x + off)) * 4 + 2];
      }
      g.putImageData(img, 0, 0); } },
  { name: "Тепловизор", draw(g, img, w, h) {
      g.putImageData(mapPixels(img, (d, i) => { const c = heat(lum(d, i) / 255); d[i] = c[0]; d[i + 1] = c[1]; d[i + 2] = c[2]; }), 0, 0); } },
  { name: "Сепия", draw(g, img, w, h) {
      g.putImageData(mapPixels(img, (d, i) => {
        const r = d[i], gr = d[i + 1], b = d[i + 2];
        d[i] = Math.min(255, .393 * r + .769 * gr + .189 * b);
        d[i + 1] = Math.min(255, .349 * r + .686 * gr + .168 * b);
        d[i + 2] = Math.min(255, .272 * r + .534 * gr + .131 * b);
      }), 0, 0); } },
  { name: "Матовое стекло", draw(g, img, w, h) {
      const a = document.createElement("canvas"); a.width = Math.max(1, w >> 4); a.height = Math.max(1, h >> 4);
      const t = document.createElement("canvas"); t.width = w; t.height = h; t.getContext("2d").putImageData(img, 0, 0);
      const ag = a.getContext("2d"); ag.imageSmoothingQuality = "high"; ag.drawImage(t, 0, 0, a.width, a.height);
      g.imageSmoothingEnabled = true; g.drawImage(a, 0, 0, w, h);
      g.fillStyle = "rgba(255,255,255,.5)"; g.fillRect(0, 0, w, h); } },
];
let fi = 0;

function nextFilter() {
  fi = (fi + 1) % FILTERS.length;
  badge.textContent = "Фильтр: " + FILTERS[fi].name;
}

// ---------- Геометрия ----------
const lerp = (a, b, t) => a + (b - a) * t;
let quad = null; // сглаженные точки TL, TR, BR, BL

function orderQuad(a, b) { // a — левая рука на экране, b — правая; по 2 точки у каждой
  const [tl, bl] = a.sort((p, q) => p.y - q.y);
  const [tr, br] = b.sort((p, q) => p.y - q.y);
  return [tl, tr, br, bl];
}

function smoothQuad(target) {
  if (!quad) quad = target.map(p => ({ ...p }));
  else quad.forEach((p, i) => { p.x = lerp(p.x, target[i].x, 0.55); p.y = lerp(p.y, target[i].y, 0.55); });
}

function pathQuad(g, q) {
  g.beginPath(); g.moveTo(q[0].x, q[0].y);
  for (let i = 1; i < 4; i++) g.lineTo(q[i].x, q[i].y);
  g.closePath();
}

const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
function isOpenHand(lm) { // 4 пальца + большой разогнуты
  const w = lm[0];
  const tips = [8, 12, 16, 20], pips = [6, 10, 14, 18];
  const fingers = tips.every((t, k) => dist(lm[t], w) > dist(lm[pips[k]], w) * 1.15);
  const thumb = dist(lm[4], lm[17]) > dist(lm[3], lm[17]) * 1.1;
  return fingers && thumb;
}

function extendedFingers(lm) { // число разогнутых пальцев без большого
  const w = lm[0], tips = [8, 12, 16, 20], pips = [6, 10, 14, 18];
  return tips.filter((t, k) => dist(lm[t], w) > dist(lm[pips[k]], w) * 1.08).length;
}

// ---------- Скриншот ----------
let dirHandle = null, shotRequested = false, shotHold = 0, lastShot = 0;
const flashEl = $("flash"), ring = $("ring"), ringArc = $("ringArc"), toast = $("toast");
let toastTimer;

function beep() {
  try {
    const ac = new (window.AudioContext || window.webkitAudioContext)(), o = ac.createOscillator(), g = ac.createGain();
    o.frequency.value = 1100; g.gain.setValueAtTime(.15, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + .15);
    o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + .16);
  } catch {}
}

function showToast(text, url) {
  $("toastTxt").textContent = text; $("toastImg").src = url || ""; $("toastImg").hidden = !url;
  toast.classList.add("show"); clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove("show"), 3500);
}

async function saveShot() { // вызывается сразу после отрисовки кадра
  const blob = await new Promise(r => canvas.toBlob(r, "image/png"));
  const d = new Date(), pad = n => String(n).padStart(2, "0");
  const name = `hand-portal_${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}_${pad(d.getHours())}-${pad(d.getMinutes())}-${pad(d.getSeconds())}.png`;
  const url = URL.createObjectURL(blob);
  let where = "в «Загрузки»";
  try {
    if (dirHandle) {
      const fh = await dirHandle.getFileHandle(name, { create: true });
      const wr = await fh.createWritable(); await wr.write(blob); await wr.close();
      where = "в папку «" + dirHandle.name + "»";
    } else throw 0;
  } catch {
    const a = document.createElement("a"); a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
  }
  showToast("Скриншот сохранён " + where + ": " + name, url);
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

function triggerShot() {
  if (performance.now() - lastShot < 1500) return;
  lastShot = performance.now(); shotRequested = true;
  flashEl.classList.remove("go"); void flashEl.offsetWidth; flashEl.classList.add("go");
  beep();
}

// ---------- Отрисовка портала ----------
const tmp = document.createElement("canvas"), tg = tmp.getContext("2d", { willReadFrequently: true });

function renderPortal(q) {
  const xs = q.map(p => p.x), ys = q.map(p => p.y);
  const x0 = Math.max(0, Math.floor(Math.min(...xs))), y0 = Math.max(0, Math.floor(Math.min(...ys)));
  const x1 = Math.min(W, Math.ceil(Math.max(...xs))), y1 = Math.min(H, Math.ceil(Math.max(...ys)));
  const w = x1 - x0, h = y1 - y0;
  if (w < 8 || h < 8) return;

  const f = FILTERS[fi];
  const img = ctx.getImageData(x0, y0, w, h); // чистый кадр камеры (портал ещё не нарисован)
  tmp.width = w; tmp.height = h;
  f.draw(tg, img, w, h);

  ctx.save();
  pathQuad(ctx, q); ctx.clip();
  ctx.drawImage(tmp, x0, y0);
  if (f.grid) drawGrid(q);
  ctx.restore();

  ctx.lineWidth = 2; ctx.strokeStyle = "rgba(255,255,255,.95)"; ctx.lineJoin = "round";
  pathQuad(ctx, q); ctx.stroke();
}

function drawGrid(q, n = 10) {
  const L = (a, b, t) => ({ x: lerp(a.x, b.x, t), y: lerp(a.y, b.y, t) });
  ctx.strokeStyle = "rgba(255,255,255,.55)"; ctx.lineWidth = 1; ctx.beginPath();
  for (let i = 1; i < n; i++) {
    const t = i / n;
    let a = L(q[0], q[1], t), b = L(q[3], q[2], t); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
    a = L(q[0], q[3], t); b = L(q[1], q[2], t); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
  }
  ctx.stroke();
}

// ---------- Основной цикл ----------
let landmarker, lastTs = -1, lastSwitch = 0, openSince = 0, wasOpen = false, lastFrame = performance.now();

function loop() {
  requestAnimationFrame(loop);
  if (video.readyState < 2) return;

  ctx.save(); ctx.scale(-1, 1); ctx.drawImage(video, -W, 0, W, H); ctx.restore(); // зеркало

  const now = performance.now();
  let res = null;
  if (video.currentTime !== lastTs) {
    lastTs = video.currentTime;
    res = landmarker.detectForVideo(video, now);
  }
  if (res) loop.res = res;
  const hands = (loop.res?.landmarks || []).map(lm =>
    lm.map(p => ({ x: (1 - p.x) * W, y: p.y * H })));

  if (hands.length === 2) {
    hands.sort((a, b) => a[0].x - b[0].x);
    smoothQuad(orderQuad([hands[0][4], hands[0][8]], [hands[1][4], hands[1][8]]));
    renderPortal(quad);

    const open = hands.every(isOpenHand);
    if (open && !wasOpen && now - lastSwitch > 900) { nextFilter(); lastSwitch = now; }
    wasOpen = open;
    statusEl.textContent = "руки: 2";
  } else {
    quad = null; wasOpen = false;
    statusEl.textContent = hands.length ? "нужна вторая рука" : "покажи руки";
  }

  // жест скриншота: 2 или 3 разогнутых пальца (кроме большого) на любой руке или на обеих, держать ~0.5 с; расстояние между пальцами не важно
  const pose = hands.some(h => { const n = extendedFingers(h); return n === 2 || n === 3; });
  if (pose) shotHold += (now - lastFrame) / 500; else shotHold = Math.max(0, shotHold - 0.1);
  ring.classList.toggle("on", shotHold > 0.05 && !shotRequested);
  ringArc.style.strokeDashoffset = 301.6 * (1 - Math.min(1, shotHold));
  if (shotHold >= 1) { shotHold = 0; triggerShot(); }

  if (shotRequested) { shotRequested = false; saveShot(); } // кадр без вспышки и подсказок

  const fps = Math.round(1000 / (now - lastFrame)); lastFrame = now;
  statusEl.textContent += " · " + fps + " fps";
}

// ---------- Запуск ----------
async function start() {
  startBtn.disabled = true; msg.textContent = "Загружаю модель…";
  try {
    const fileset = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
    landmarker = await HandLandmarker.createFromOptions(fileset, {
      baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task", delegate: "GPU" },
      runningMode: "VIDEO", numHands: 2,
    });
    msg.textContent = "Запрашиваю камеру…";
    const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480, facingMode: "user" }, audio: false });
    video.srcObject = stream; await video.play();
    W = canvas.width = video.videoWidth || 640; H = canvas.height = video.videoHeight || 480;
        overlay.hidden = true; overlay.style.display = "none";
    badge.hidden = statusEl.hidden = false; badge.textContent = "Фильтр: " + FILTERS[fi].name;
    loop();
  } catch (e) {
    console.error(e);
    msg.textContent = "Ошибка: " + (e.message || e) + ". Нужен HTTPS (или localhost) и доступ к камере.";
    startBtn.disabled = false;
  }
}

startBtn.addEventListener("click", start);
canvas.addEventListener("click", nextFilter);
addEventListener("keydown", e => { if (e.code === "Space" || e.code === "ArrowRight") { e.preventDefault(); nextFilter(); } });
</script>
</body>
</html>
